# Main CI pipeline: lint (ruff) + test (pytest + coverage)
#
# Pinned actions (tag + full SHA for supply-chain security):
#   actions/checkout        v4.2.2  11bd71901bbe5b1630ceea73d27597364c9af683
#   prefix-dev/setup-pixi  v0.9.4  a0af7a228712d6121d37aba47adf55c1332c9c2e
#   codecov/codecov-action  v5.5.0  fdcc8476540edceab3de004e990f80d881c6cc00

name: CI

on:
  push:
    branches:
      - master
      - next
      - "feature/**"
      - "bug/**"
      - "fix/**"
      - "chore/**"
    tags: ["v*"]
  pull_request:
    branches: [master, next]
  workflow_dispatch:

# Cancel any in-progress run for the same branch/PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e  # v0.9.4
        with:
          cache: true

      - name: Run ruff
        run: pixi run ruff check quicknxs/

  test:
    name: test
    runs-on: ubuntu-24.04
    # Set Qt platform to offscreen for headless CI runners.
    # tests/conftest.py also calls os.environ.setdefault("QT_QPA_PLATFORM", "offscreen"),
    # so either mechanism alone would suffice; both together is belt-and-suspenders.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e  # v0.9.4
        with:
          cache: true

      - name: Run pytest with coverage
        run: pixi run pytest --cov=quicknxs --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fdcc8476540edceab3de004e990f80d881c6cc00  # v5.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # Do not fail CI if Codecov upload fails (e.g. network issue, missing token).
          # Change to true once CODECOV_TOKEN is configured in repository secrets.
          fail_ci_if_error: false
          verbose: true
