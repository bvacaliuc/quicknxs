# Monthly automated pixi lockfile refresh.
#
# Runs pixi update, generates a human-readable markdown diff, then opens a PR
# against next so a maintainer can review and merge the dependency bump.
#
# One-time repository setup required:
#   Settings > Actions > General > Workflow permissions:
#     Enable "Allow GitHub Actions to create and approve pull requests"
#   (See GitHub issue: "Enable 'Allow GitHub Actions to create PRs' for lockfile workflow")
#
# Pinned actions (tag + full SHA for supply-chain security):
#   actions/checkout             v4.2.2  11bd71901bbe5b1630ceea73d27597364c9af683
#   prefix-dev/setup-pixi        v0.9.4  a0af7a228712d6121d37aba47adf55c1332c9c2e
#   peter-evans/create-pull-request v8.1.0  c0f553fe549906ede9cf27b5156039d195d2ece0

name: Update pixi lockfile

on:
  schedule:
    # 05:17 UTC on the 1st of every month.
    # Offset from midnight to reduce load on GitHub's scheduler.
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -el {0}

jobs:
  update-lockfile:
    name: Update pixi.lock
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up pixi (no cache — resolve fresh against conda-forge)
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e  # v0.9.4
        with:
          cache: false

      - name: Update lockfile and generate markdown diff
        run: |
          pixi update --json | pixi exec pixi-diff-to-markdown > diff.md
          echo "=== Lockfile diff summary ==="
          cat diff.md

      - name: Build PR body
        id: pr-body
        run: |
          {
            echo "body<<PR_BODY_EOF"
            echo "## Monthly pixi lockfile update"
            echo ""
            echo "Automated dependency bump generated by the monthly workflow."
            echo ""
            cat diff.md
            echo "PR_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0  # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pixi.lock"
          branch: chore/update-pixi-lockfile
          delete-branch: true
          title: "chore: monthly pixi lockfile update"
          body: ${{ steps.pr-body.outputs.body }}
          labels: dependencies
          base: next
